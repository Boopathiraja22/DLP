name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pdfplumber reportlab pyinstaller -q
      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "DutyListParser" `
            --collect-all pdfplumber `
            --collect-all reportlab `
            duty_list_gui.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DutyListParser-Windows
          path: dist/DutyListParser.exe
          retention-days: 30
